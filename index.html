<!DOCTYPE html>
<html lang="en" data-theme-default="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Glassflow — Mindful Personal Finance & Expense Tracker</title>
    <meta
      name="description"
      content="Glassflow is an intelligent personal finance and expense tracking app designed with aurora glassmorphism. Track cash flow, set monthly category budgets, and build mindful financial habits."
    />
    <meta name="theme-color" content="#0b0f1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />

    <!-- Glassflow Glowing Wallet Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b5cf6' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><rect width='20' height='14' x='2' y='5' rx='3' fill='%238b5cf6' fill-opacity='0.15'/><line x1='2' x2='22' y1='10' y2='10'/><circle cx='18' cy='15' r='1.5' fill='%2310b981'/></svg>"
    />
    <link rel="alternate icon" type="image/png" href="/favicon.ico" />

    <!-- Google Fonts: Outfit (headings) & Plus Jakarta Sans (body/numerics) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the theme before first paint so the loader and the app share one background.
      // data-theme-default mirrors APP_CONFIG.defaultTheme (the platform keeps it in sync).
      (function () {
        var d = document.documentElement, stored = null;
        try { stored = localStorage.getItem('app-theme'); } catch (e) {}
        var mode = stored || d.getAttribute('data-theme-default') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        d.classList.toggle('dark', dark);
      })();
    </script>
    <script defer src="%VITE_APPER_SDK_CDN_URL%"></script>
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: var(--background, #0b0f1a);
        color: var(--muted-foreground, #94a3b8);
        font: 14px/1.4 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      #app-loading .brand-ring {
        position: relative;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: rgba(139, 92, 246, 0.15);
        border: 1px solid rgba(139, 92, 246, 0.3);
      }
      #app-loading .ring-spinner {
        position: absolute;
        inset: -4px;
        border-radius: 18px;
        border: 2px solid transparent;
        border-top-color: #8b5cf6;
        animation: app-spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      #app-loading .brand-title {
        font-family: 'Outfit', system-ui, sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--foreground, #f8fafc);
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loading">
        <div class="brand-ring">
          <div class="ring-spinner"></div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="14" x="2" y="5" rx="3"/>
            <line x1="2" x2="22" y1="10" y2="10"/>
          </svg>
        </div>
        <span class="brand-title">Glassflow</span>
      </div>
    </div>
    <script>
      (function () {
        function note(text) {
          var el = document.getElementById('app-loading');
          if (!el) return;
          var p = el.querySelector('.note');
          if (!p) {
            p = document.createElement('span');
            p.className = 'note';
            p.style.cssText = 'font-size:12px;opacity:.7;max-width:22rem;text-align:center';
            el.appendChild(p);
          }
          p.textContent = text;
        }
        setTimeout(function () { note('Starting up\u2026 the first open can take a few seconds.'); }, 3000);
        setTimeout(function () { note('Still loading. If this continues, check your connection and refresh.'); }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
